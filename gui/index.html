<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP Tennis Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .odds-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* Results Panel */
        .results-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem;
        }

        .result-content {
            display: none;
        }

        .matchup-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .player-row:last-child {
            margin-bottom: 0;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .prob-badge {
            background: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .prob-badge.favorite {
            background: var(--success);
        }

        .prob-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
            display: flex;
        }

        .prob-bar {
            height: 100%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fair-odds {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.25rem;
        }

        .betting-analysis {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 1rem;
            padding: 1.5rem;
            display: none;
        }

        .betting-analysis h3 {
            color: var(--success);
            margin-bottom: 1rem;
            font-size: 1.125rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warning);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            color: var(--warning);
            font-size: 0.875rem;
            display: none;
        }

        /* Loader */
        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid var(--border);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Configuration Panel -->
        <div class="glass-panel" style="animation-delay: 0s;">
            <div class="header">
                <h1>ATP Predictor</h1>
                <p class="subtitle">Data-driven win probabilities & fair odds</p>
            </div>

            <form id="predict-form">
                <div class="form-group">
                    <label>Player 1</label>
                    <input type="text" id="p1" list="playersList" placeholder="e.g. Novak Djokovic" required>
                </div>

                <div class="form-group">
                    <label>Player 2</label>
                    <input type="text" id="p2" list="playersList" placeholder="e.g. Carlos Alcaraz" required>
                </div>

                <datalist id="playersList"></datalist>

                <div class="form-group">
                    <label>Surface</label>
                    <select id="surface">
                        <option value="Hard">Hard</option>
                        <option value="Clay">Clay</option>
                        <option value="Grass">Grass</option>
                    </select>
                </div>

                <div class="odds-row">
                    <div class="form-group">
                        <label>Odds P1 (Opt.)</label>
                        <input type="number" id="odds1" step="0.01" min="1.01" placeholder="Decimal">
                    </div>
                    <div class="form-group">
                        <label>Odds P2 (Opt.)</label>
                        <input type="number" id="odds2" step="0.01" min="1.01" placeholder="Decimal">
                    </div>
                </div>

                <button type="submit" id="submit-btn">Run Prediction</button>
            </form>
        </div>

        <!-- Results Panel -->
        <div class="glass-panel results-panel" style="animation-delay: 0.2s;">
            <div id="empty-state" class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 1rem;">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <p>Configure a matchup and run the prediction to see results.</p>
            </div>

            <div id="loader" class="loader"></div>

            <div id="result-content" class="result-content">
                <div id="warning-box" class="warning-box"></div>

                <div class="matchup-card">
                    <!-- Player 1 -->
                    <div>
                        <div class="player-row">
                            <span id="res-p1-name" class="player-name">Player 1</span>
                            <span id="res-p1-prob" class="prob-badge">50%</span>
                        </div>
                        <div class="prob-bar-container">
                            <div id="res-p1-bar" class="prob-bar" style="background: var(--primary); width: 0%;"></div>
                        </div>
                        <div id="res-p1-fair" class="fair-odds">Fair Odds: 2.00</div>
                    </div>

                    <div style="height: 1.5rem;"></div>

                    <!-- Player 2 -->
                    <div>
                        <div class="player-row">
                            <span id="res-p2-name" class="player-name">Player 2</span>
                            <span id="res-p2-prob" class="prob-badge">50%</span>
                        </div>
                        <div class="prob-bar-container">
                            <div id="res-p2-bar" class="prob-bar" style="background: var(--primary); width: 0%;"></div>
                        </div>
                        <div id="res-p2-fair" class="fair-odds">Fair Odds: 2.00</div>
                    </div>
                </div>

                <div id="betting-analysis" class="betting-analysis">
                    <h3>✅ Profitable Edge Found</h3>
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-label">Value On</div>
                            <div id="ba-player" class="stat-value">Player</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Expected Value</div>
                            <div id="ba-ev" class="stat-value" style="color: var(--success);">+0%</div>
                        </div>
                        <div class="stat-box" style="grid-column: span 2;">
                            <div class="stat-label">Recommended Bet (1/4 Kelly)</div>
                            <div id="ba-kelly" class="stat-value">0% of bankroll</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch players to populate datalist
        fetch('/api/players')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('playersList');
                data.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.Player; // the key from current_elos.csv
                    list.appendChild(option);
                });
            })
            .catch(err => console.error("Could not load players", err));

        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const p1 = document.getElementById('p1').value;
            const p2 = document.getElementById('p2').value;
            const surface = document.getElementById('surface').value;
            const odds1 = document.getElementById('odds1').value;
            const odds2 = document.getElementById('odds2').value;

            const btn = document.getElementById('submit-btn');
            
            // UI State transitions
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('result-content').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            btn.disabled = true;
            btn.textContent = 'Analyzing...';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p1, p2, surface, odds1, odds2 })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Unknown error occurred');
                }

                // Populate Data
                document.getElementById('res-p1-name').textContent = data.player1;
                document.getElementById('res-p2-name').textContent = data.player2;
                
                document.getElementById('res-p1-prob').textContent = (data.prob1 * 100).toFixed(1) + '%';
                document.getElementById('res-p2-prob').textContent = (data.prob2 * 100).toFixed(1) + '%';
                
                document.getElementById('res-p1-fair').textContent = 'Fair Odds: ' + data.fair_odds1.toFixed(2);
                document.getElementById('res-p2-fair').textContent = 'Fair Odds: ' + data.fair_odds2.toFixed(2);

                // Set styles for favorite
                const p1Badge = document.getElementById('res-p1-prob');
                const p2Badge = document.getElementById('res-p2-prob');
                p1Badge.className = 'prob-badge ' + (data.prob1 >= 0.5 ? 'favorite' : '');
                p2Badge.className = 'prob-badge ' + (data.prob2 >= 0.5 ? 'favorite' : '');

                // Animations
                setTimeout(() => {
                    document.getElementById('res-p1-bar').style.width = (data.prob1 * 100) + '%';
                    document.getElementById('res-p1-bar').style.background = data.prob1 >= 0.5 ? 'var(--success)' : 'var(--primary)';
                    document.getElementById('res-p2-bar').style.width = (data.prob2 * 100) + '%';
                    document.getElementById('res-p2-bar').style.background = data.prob2 >= 0.5 ? 'var(--success)' : 'var(--primary)';
                }, 100);

                // Warnings
                const warningBox = document.getElementById('warning-box');
                if (data.warnings && data.warnings.length > 0) {
                    warningBox.innerHTML = data.warnings.join('<br>');
                    warningBox.style.display = 'block';
                } else {
                    warningBox.style.display = 'none';
                }

                // Betting Analysis
                const baBox = document.getElementById('betting-analysis');
                if (data.betting_analysis && data.betting_analysis.edge_player) {
                    const ba = data.betting_analysis;
                    document.getElementById('ba-player').textContent = ba.edge_player;
                    document.getElementById('ba-ev').textContent = '+' + (ba.ev * 100).toFixed(1) + '%';
                    document.getElementById('ba-kelly').textContent = (ba.kelly_fraction/4 * 100).toFixed(2) + '% of bankroll';
                    baBox.style.display = 'block';
                } else if (odds1 && odds2) {
                    baBox.innerHTML = '<h3 style="color: var(--warning);">❌ No Edge Found</h3><p style="color: var(--text-muted); font-size: 0.875rem;">Neither player offers value at these odds.</p>';
                    baBox.style.borderColor = 'var(--warning)';
                    baBox.style.background = 'rgba(245, 158, 11, 0.1)';
                    baBox.style.display = 'block';
                } else {
                    baBox.style.display = 'none';
                }

                // Show results
                document.getElementById('loader').style.display = 'none';
                document.getElementById('result-content').style.display = 'block';

            } catch (err) {
                alert('Error: ' + err.message);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run Prediction';
            }
        });
    </script>
</body>
</html>
