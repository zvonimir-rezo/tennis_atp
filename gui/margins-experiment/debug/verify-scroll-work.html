<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margins · scroll work regression</title><style>body{font:14px Arial;margin:16px}iframe{width:100%;height:720px;border:1px solid}pre{white-space:pre-wrap}button{min-height:44px}</style><button id="run">Verify scroll work</button><pre id="result">Ready</pre><iframe src="../" title="Actual Margins"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{const checks=[];const check=(name,pass,detail)=>checks.push({name,pass,detail});const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;await sleep(200);const section=d.querySelector('#sequence'),stage=d.querySelector('#theatre'),top=w.scrollY+section.getBoundingClientRect().top,travel=section.offsetHeight-stage.clientHeight;
const points=[...d.querySelectorAll('.point')],cue=d.querySelector('#scroll-cue').firstChild;let reads=0,cues=0,heldMoves=0,active=false;const restore=[];
for(const [prototype,name] of [[w.Element.prototype,'getBoundingClientRect'],[w.HTMLElement.prototype,'offsetHeight'],[w.Element.prototype,'clientHeight'],[w.HTMLElement.prototype,'offsetTop']]){const desc=Object.getOwnPropertyDescriptor(prototype,name);if(!desc)continue;restore.push(()=>Object.defineProperty(prototype,name,desc));if(desc.get)Object.defineProperty(prototype,name,{...desc,get(){if(active)reads++;return desc.get.call(this);}});else Object.defineProperty(prototype,name,{...desc,value:function(...a){if(active)reads++;return desc.value.apply(this,a);}});}
const heldCoordinates=()=>new Set(points.filter(n=>+n.dataset.id>=88&&+n.dataset.id<=125).map(n=>{const m=n.transform.baseVal.getItem(0).matrix;return m.e+':'+m.f;}));let heldMatrices; // Chromium can return distinct wrappers for the same live SVGTransform. Compare coordinates, not wrapper identity.
const nativeTranslate=w.SVGTransform.prototype.setTranslate;w.SVGTransform.prototype.setTranslate=function(...args){if(active&&heldMatrices.has(this.matrix.e+':'+this.matrix.f))heldMoves++;return nativeTranslate.apply(this,args);};restore.push(()=>{w.SVGTransform.prototype.setTranslate=nativeTranslate;});
const observer=new w.MutationObserver(entries=>{for(const e of entries){if(e.target.id==='scroll-cue')cues++;if(e.target.matches?.('.point')&&+e.target.dataset.id>=88&&+e.target.dataset.id<=125)heldMoves++;}});
async function sweep(from,to){await new Promise(resolve=>{let i=0;function tick(){w.scrollTo({top:top+travel*(from+(to-from)*i/30),behavior:'instant'});if(i<30){i++;w.requestAnimationFrame(tick);}else w.requestAnimationFrame(resolve);}w.requestAnimationFrame(tick);});}
await sweep(.6,.6);await sleep(50);heldMatrices=heldCoordinates();
try{active=true;observer.observe(stage,{subtree:true,attributes:true,childList:true});await sweep(.6,.85);await sweep(.85,.6);active=false;observer.disconnect();check('No synchronous layout reads while the playhead moves',reads===0,reads);check('Unchanged scroll-cue node survives every frame',cues===0&&d.querySelector('#scroll-cue').firstChild===cue,cues);check('Held set two receives no point transform writes during cancellation',heldMoves===0,heldMoves);check('All 422 point elements preserve object identity',points.length===422&&points.every(n=>d.querySelector(`.point[data-id="${n.dataset.id}"]`)===n),points.length);check('Latest reverse position wins without a timed tail',w.marginsCourtSnapshot().phase===2,w.marginsCourtSnapshot().progress);}finally{active=false;restore.forEach(f=>f());observer.disconnect();}
// Matrix parity uses the actual SVG transform list, not metadata alone. No consolidate(): it would mutate the retained transform list.
for(const [width,height] of [[1440,900],[390,844],[320,590]]){frame.style.width=width+'px';frame.style.height=height+'px';await sleep(200);const base=w.scrollY+section.getBoundingClientRect().top,span=section.offsetHeight-stage.clientHeight;let maxError=0,valid=true;for(const p of [0,.125,.25,.38,.49,.56,.61,.72,.78,.86,1,.78,.54,.32,0]){w.scrollTo({top:base+span*p,behavior:'instant'});await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const state=w.marginsCourtSnapshot();for(const q of state.positions){const n=points[q.id-1],list=n.transform.baseVal;if(list.numberOfItems!==2){valid=false;continue;}const m=list.getItem(0).matrix.multiply(list.getItem(1).matrix),scale=w.innerWidth<=760?(w.innerHeight<740?.45:.55):(w.innerWidth<=1050?(w.innerHeight<740?.59:.7):(w.innerHeight<740||w.innerWidth<=1400?.85:1));maxError=Math.max(maxError,Math.abs(m.e-q.x),Math.abs(m.f-q.y),Math.abs(m.a-scale),Math.abs(m.d-scale));if(n.style.transform)valid=false;}}check(width+'×'+height+': native matrices match every record through intermediate/reverse positions',valid&&maxError<.0001,{tolerance:.0001,maxError});}
out.textContent=JSON.stringify({pass:checks.every(c=>c.pass),checks},null,2);document.title=(checks.every(c=>c.pass)?'PASS':'FAIL')+' · Margins scroll work';};
</script></html>
