[project]
name = "tennis-atp-bookmaking"
version = "0.1.0"
description = "ATP singles analysis and fair-odds modeling pipeline."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "pytest>=8.2",
  "ruff>=0.5",
  "seaborn>=0.13",
]
ml-extra = [
  "catboost>=1.2",
  "lightgbm>=4.5",
  "optuna>=3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
